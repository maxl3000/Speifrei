<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1117">
<meta name="robots" content="noindex, nofollow">
<title>Speifrei – Wer hält am längsten durch?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤮</text></svg>">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --card: #1e222e;
    --card2: #262b3a;
    --text: #eef0f6;
    --muted: #8b93a7;
    --accent: #7cf2a5;
    --accent2: #4fd1c5;
    --danger: #ff5c7a;
    --warn: #ffb347;
    --gold: #ffd166;
    --silver: #c9d1e0;
    --bronze: #d59a5b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1d3a2f 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3.2rem);
    letter-spacing: -0.02em;
  }
  header h1 span { display: inline-block; transform: translateY(2px); }
  header p { margin: 6px 0 0; color: var(--muted); }

  .banner {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #3a1d2a, #2a1521);
    border: 1px solid #5a2a3c;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .banner .emoji { font-size: 2rem; }
  .banner strong { color: var(--danger); }
  .banner small { color: var(--muted); display: block; }
  .banner.king {
    background: linear-gradient(135deg, #2a3a1d, #1b2a15);
    border-color: #3f5a2a;
  }
  .banner.king strong { color: var(--accent); }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.04);
  }

  form.add { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 560px) {
    form.add { grid-template-columns: 1.2fr 1.4fr auto; align-items: end; }
  }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="datetime-local"] {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg2);
    border: 1px solid #2f3546;
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    color-scheme: dark;
  }
  input:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: .95rem;
    font-weight: 600;
    background: var(--card2);
    color: var(--text);
    transition: transform .06s ease, background .15s;
    white-space: nowrap;
  }
  button:hover { background: #303649; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #0b1a10; }
  button.primary:hover { background: #95f7b8; }
  button.danger { background: #3a1d26; color: var(--danger); }
  button.danger:hover { background: #4a2430; }
  button.ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
  button.ghost:hover { color: var(--text); background: rgba(255,255,255,.05); }
  button.puke { background: var(--danger); color: #fff; font-size: 1rem; }
  button.puke:hover { background: #ff7590; }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .person {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(255,255,255,.05);
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .person.rank-1 { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 30px rgba(255,209,102,.15); }
  .person.rank-2 { border-color: var(--silver); }
  .person.rank-3 { border-color: var(--bronze); }
  .person.last { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger), 0 8px 30px rgba(255,92,122,.18); }
  .person.future { opacity: .7; }

  .rank {
    width: 52px; height: 52px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--bg2);
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--muted);
  }
  .rank.medal { font-size: 1.9rem; }

  .info { min-width: 0; }
  .name-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 1.2rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .tag {
    font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px;
  }
  .tag.king { background: rgba(255,209,102,.18); color: var(--gold); }
  .tag.last { background: rgba(255,92,122,.18); color: var(--danger); }
  .tag.record { background: rgba(124,242,165,.15); color: var(--accent); }

  .timer {
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 4px 0 2px;
    line-height: 1.1;
  }
  .timer .days { color: var(--accent); }
  .timer .clock { color: var(--text); }
  .timer .unit { font-size: .55em; font-weight: 600; color: var(--muted); margin: 0 6px 0 3px; }
  .meta { color: var(--muted); font-size: .82rem; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta span::before { content: "•"; margin-right: 8px; opacity: .5; }
  .meta span:first-child::before { content: ""; margin: 0; }

  .actions {
    grid-column: 1 / -1;
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 4px;
  }
  .actions .spacer { flex: 1; }

  .empty {
    text-align: center; color: var(--muted); padding: 40px 10px;
    border: 2px dashed #2f3546; border-radius: var(--radius);
  }
  .empty .big { font-size: 3rem; margin-bottom: 8px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .stats { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 14px; }

  dialog {
    background: var(--card);
    color: var(--text);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius);
    padding: 20px;
    width: min(92vw, 420px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 12px; font-size: 1.2rem; }
  dialog .row { margin-bottom: 12px; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
    background: #2a2f3f; color: var(--text);
    padding: 10px 16px; border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    opacity: 0; transition: all .2s ease; pointer-events: none;
    font-size: .9rem;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 30px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>🤮</span> Speifrei</h1>
    <p>Wer hält am längsten durch? Die Bestenliste unter Freunden.</p>
  </header>

  <div id="banner"></div>

  <div class="card">
    <form class="add" id="addForm" autocomplete="off">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="z. B. Kevin" maxlength="30" required>
      </div>
      <div>
        <label for="since">Zuletzt gekotzt am</label>
        <input type="datetime-local" id="since" required>
      </div>
      <button type="submit" class="primary">+ Hinzufügen</button>
    </form>
  </div>

  <div class="list" id="list"></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button id="shareBtn">🔗 Liste teilen</button>
    <button id="exportBtn">⬇️ Export</button>
    <button id="importBtn">⬆️ Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button id="clearBtn" class="danger">🗑 Alles löschen</button>
  </div>

  <footer>
    Daten liegen nur in deinem Browser (localStorage). Über „Liste teilen“ bekommst du einen Link mit dem aktuellen Stand.
  </footer>
</div>

<dialog id="editDialog">
  <h2 id="editTitle">Datum ändern</h2>
  <div class="row">
    <label for="editName">Name</label>
    <input type="text" id="editName" maxlength="30">
  </div>
  <div class="row">
    <label for="editSince">Zuletzt gekotzt am</label>
    <input type="datetime-local" id="editSince">
  </div>
  <div class="btns">
    <button type="button" id="editCancel">Abbrechen</button>
    <button type="button" class="primary" id="editSave">Speichern</button>
  </div>
</dialog>

<dialog id="confirmDialog">
  <h2 id="confirmTitle">Sicher?</h2>
  <p id="confirmText" style="color: var(--muted); margin: 0;"></p>
  <div class="btns">
    <button type="button" id="confirmNo">Abbrechen</button>
    <button type="button" class="danger" id="confirmYes">Ja</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'speifrei.v1';
  const $ = (sel) => document.querySelector(sel);

  /** @type {{people: Array<{id:string,name:string,since:number,count:number,best:number,history:number[]}>}} */
  let state = { people: [] };
  let editingId = null;

  // ---------- Helpers ----------
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const pad = (n) => String(n).padStart(2, '0');

  function toLocalInput(ms) {
    const d = new Date(ms);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fromLocalInput(v) {
    const t = new Date(v).getTime();
    return Number.isFinite(t) ? t : null;
  }
  function fmtDate(ms) {
    return new Date(ms).toLocaleString('de-DE', {
      day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  }
  function split(ms) {
    if (ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  }
  function fmtShort(ms) {
    const t = split(ms);
    if (t.d > 0) return `${t.d} T ${t.h} h`;
    if (t.h > 0) return `${t.h} h ${t.m} min`;
    return `${t.m} min`;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }
  function confirmDlg(title, text) {
    return new Promise((resolve) => {
      const dlg = $('#confirmDialog');
      $('#confirmTitle').textContent = title;
      $('#confirmText').textContent = text;
      const done = (v) => { dlg.close(); cleanup(); resolve(v); };
      const yes = () => done(true);
      const no = () => done(false);
      const cleanup = () => {
        $('#confirmYes').removeEventListener('click', yes);
        $('#confirmNo').removeEventListener('click', no);
        dlg.removeEventListener('cancel', onCancel);
      };
      const onCancel = (e) => { e.preventDefault(); no(); };
      $('#confirmYes').addEventListener('click', yes);
      $('#confirmNo').addEventListener('click', no);
      dlg.addEventListener('cancel', onCancel);
      dlg.showModal();
    });
  }

  // ---------- Persistence ----------
  function normalizePerson(p) {
    if (!p || typeof p !== 'object') return null;
    const since = Number(p.since);
    if (!p.name || !Number.isFinite(since)) return null;
    const history = Array.isArray(p.history) ? p.history.map(Number).filter(Number.isFinite).sort((a, b) => a - b) : [since];
    return {
      id: String(p.id || uid()),
      name: String(p.name).slice(0, 30),
      since,
      count: Number.isFinite(Number(p.count)) ? Number(p.count) : history.length,
      best: Number.isFinite(Number(p.best)) ? Number(p.best) : 0,
      history: history.length ? history : [since],
    };
  }
  function normalizeState(raw) {
    const people = Array.isArray(raw?.people) ? raw.people.map(normalizePerson).filter(Boolean) : [];
    return { people };
  }
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (raw) state = normalizeState(raw);
    } catch { /* ignore */ }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* ignore */ }
    render();
  }

  // ---------- Share via URL ----------
  function encodeShare(st) {
    const compact = st.people.map((p) => ({ n: p.name, s: p.since, c: p.count, b: p.best, h: p.history }));
    const json = JSON.stringify(compact);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeShare(str) {
    const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(escape(atob(b64)));
    const arr = JSON.parse(json);
    if (!Array.isArray(arr)) throw new Error('bad');
    return normalizeState({ people: arr.map((x) => ({ name: x.n, since: x.s, count: x.c, best: x.b, history: x.h })) });
  }
  function shareUrl() {
    return `${location.origin}${location.pathname}#d=${encodeShare(state)}`;
  }
  async function handleShareHash() {
    const m = location.hash.match(/^#d=(.+)$/);
    if (!m) return;
    let incoming;
    try { incoming = decodeShare(m[1]); } catch { toast('Ungültiger Link.'); return; }
    history.replaceState(null, '', location.pathname + location.search);
    if (!incoming.people.length) return;
    if (state.people.length) {
      const ok = await confirmDlg('Geteilte Liste laden?', `Der Link enthält ${incoming.people.length} Person(en). Deine aktuelle Liste (${state.people.length}) wird ersetzt.`);
      if (!ok) return;
    }
    state = incoming;
    save();
    toast('Liste aus Link geladen.');
  }

  // ---------- Rendering ----------
  function sorted() {
    // Längste Zeit ohne Kotzen = Platz 1
    return [...state.people].sort((a, b) => a.since - b.since);
  }
  function currentStreak(p, now) { return Math.max(0, now - p.since); }

  function render() {
    const now = Date.now();
    const list = $('#list');
    const people = sorted();
    const n = people.length;

    // Banner
    const banner = $('#banner');
    if (n >= 2) {
      const last = people[n - 1];
      const king = people[0];
      banner.innerHTML = `
        <div class="banner">
          <div class="emoji">🤮</div>
          <div>
            <strong>${esc(last.name)}</strong> hat zuletzt gekotzt
            <small>${fmtDate(last.since)} · vor <span data-ago="${last.id}">${fmtShort(currentStreak(last, now))}</span></small>
          </div>
        </div>
        <div class="banner king">
          <div class="emoji">👑</div>
          <div>
            <strong>${esc(king.name)}</strong> ist Speifrei-König
            <small>seit ${fmtDate(king.since)} · <span data-ago="${king.id}">${fmtShort(currentStreak(king, now))}</span> durchgehalten</small>
          </div>
        </div>`;
    } else {
      banner.innerHTML = '';
    }

    // List
    if (!n) {
      list.innerHTML = `<div class="empty"><div class="big">🍻</div>Noch niemand dabei.<br>Füge oben die erste Person hinzu.</div>`;
      $('#stats').textContent = '';
      return;
    }

    const medals = ['🥇', '🥈', '🥉'];
    list.innerHTML = people.map((p, i) => {
      const rank = i + 1;
      const isLast = n >= 2 && i === n - 1;
      const isKing = n >= 2 && i === 0;
      const future = p.since > now;
      const streak = currentStreak(p, now);
      const record = p.best > 0 && streak > p.best;
      const cls = ['person', `rank-${rank}`, isLast ? 'last' : '', future ? 'future' : ''].filter(Boolean).join(' ');
      return `
      <div class="${cls}" data-id="${p.id}">
        <div class="rank ${rank <= 3 ? 'medal' : ''}">${rank <= 3 ? medals[rank - 1] : '#' + rank}</div>
        <div class="info">
          <div class="name-row">
            <span class="name">${esc(p.name)}</span>
            ${isKing ? '<span class="tag king">König</span>' : ''}
            ${isLast ? '<span class="tag last">Zuletzt gekotzt</span>' : ''}
            <span class="tag record" data-record="${p.id}" ${record ? '' : 'hidden'}>Rekord läuft</span>
          </div>
          <div class="timer" data-timer="${p.id}">${timerHtml(streak)}</div>
          <div class="meta">
            <span>seit ${fmtDate(p.since)}${future ? ' (in der Zukunft?)' : ''}</span>
            <span>${p.count}× gekotzt</span>
            <span>Rekord: <span data-best="${p.id}">${fmtShort(Math.max(p.best, streak))}</span></span>
          </div>
        </div>
        <div class="actions">
          <button class="puke" data-action="puke" title="Timer auf jetzt zurücksetzen">🤮 Gerade gekotzt!</button>
          <span class="spacer"></span>
          <button class="ghost" data-action="edit" title="Bearbeiten">✏️</button>
          <button class="ghost" data-action="delete" title="Entfernen">🗑</button>
        </div>
      </div>`;
    }).join('');

    const total = state.people.reduce((a, p) => a + p.count, 0);
    $('#stats').textContent = `${n} Person${n === 1 ? '' : 'en'} · ${total} Kotz-Ereignis${total === 1 ? '' : 'se'} insgesamt`;
  }

  function timerHtml(ms) {
    const t = split(ms);
    const clock = `${pad(t.h)}:${pad(t.m)}:${pad(t.s)}`;
    if (t.d > 0) {
      return `<span class="days">${t.d}</span><span class="unit">${t.d === 1 ? 'Tag' : 'Tage'}</span><span class="clock">${clock}</span>`;
    }
    return `<span class="clock">${clock}</span>`;
  }

  function tick() {
    const now = Date.now();
    for (const p of state.people) {
      const streak = currentStreak(p, now);
      const el = document.querySelector(`[data-timer="${p.id}"]`);
      if (el) el.innerHTML = timerHtml(streak);
      const ago = document.querySelectorAll(`[data-ago="${p.id}"]`);
      ago.forEach((a) => { a.textContent = fmtShort(streak); });
      const best = document.querySelector(`[data-best="${p.id}"]`);
      if (best) best.textContent = fmtShort(Math.max(p.best, streak));
      const rec = document.querySelector(`[data-record="${p.id}"]`);
      if (rec) rec.hidden = !(p.best > 0 && streak > p.best);
    }
  }

  // ---------- Actions ----------
  function addPerson(name, since) {
    state.people.push({ id: uid(), name, since, count: 1, best: 0, history: [since] });
    save();
    toast(`${name} ist dabei. Viel Glück. 🍀`);
  }
  function puke(p) {
    const now = Date.now();
    const streak = currentStreak(p, now);
    if (streak > p.best) p.best = streak;
    p.since = now;
    p.count += 1;
    p.history.push(now);
    save();
    toast(`${p.name}: ${fmtShort(streak)} durchgehalten. Timer läuft neu. 🤮`);
  }
  function openEdit(p) {
    editingId = p.id;
    $('#editTitle').textContent = `${p.name} bearbeiten`;
    $('#editName').value = p.name;
    $('#editSince').value = toLocalInput(p.since);
    $('#editDialog').showModal();
  }
  function saveEdit() {
    const p = state.people.find((x) => x.id === editingId);
    if (!p) return;
    const name = $('#editName').value.trim();
    const since = fromLocalInput($('#editSince').value);
    if (!name) { toast('Name fehlt.'); return; }
    if (since === null) { toast('Ungültiges Datum.'); return; }
    p.name = name;
    if (since !== p.since) {
      p.since = since;
      p.history[p.history.length - 1] = since;
      p.history.sort((a, b) => a - b);
    }
    $('#editDialog').close();
    save();
    toast('Gespeichert.');
  }

  // ---------- Events ----------
  $('#addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#name').value.trim();
    const since = fromLocalInput($('#since').value);
    if (!name) { toast('Name fehlt.'); return; }
    if (since === null) { toast('Ungültiges Datum.'); return; }
    addPerson(name, since);
    $('#name').value = '';
    $('#since').value = toLocalInput(Date.now());
    $('#name').focus();
  });

  $('#list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const card = btn.closest('[data-id]');
    const p = state.people.find((x) => x.id === card.dataset.id);
    if (!p) return;
    const action = btn.dataset.action;
    if (action === 'puke') {
      const ok = await confirmDlg(`${p.name} hat gerade gekotzt?`, 'Der Timer wird auf jetzt zurückgesetzt. Die bisherige Zeit zählt als Rekord, falls sie besser war.');
      if (ok) puke(p);
    } else if (action === 'edit') {
      openEdit(p);
    } else if (action === 'delete') {
      const ok = await confirmDlg(`${p.name} entfernen?`, 'Alle Daten dieser Person werden gelöscht.');
      if (ok) {
        state.people = state.people.filter((x) => x.id !== p.id);
        save();
        toast(`${p.name} entfernt.`);
      }
    }
  });

  $('#editSave').addEventListener('click', saveEdit);
  $('#editCancel').addEventListener('click', () => $('#editDialog').close());
  $('#editDialog').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveEdit(); } });

  $('#shareBtn').addEventListener('click', async () => {
    if (!state.people.length) { toast('Erst jemanden hinzufügen.'); return; }
    const url = shareUrl();
    if (navigator.share) {
      try { await navigator.share({ title: 'Speifrei', text: 'Wer hält am längsten durch?', url }); return; } catch { /* fallthrough */ }
    }
    try {
      await navigator.clipboard.writeText(url);
      toast('Link kopiert! 🔗');
    } catch {
      prompt('Link zum Kopieren:', url);
    }
  });

  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `speifrei-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const incoming = normalizeState(JSON.parse(await file.text()));
      if (!incoming.people.length) throw new Error('empty');
      if (state.people.length) {
        const ok = await confirmDlg('Import?', `${incoming.people.length} Person(en) werden geladen. Deine aktuelle Liste wird ersetzt.`);
        if (!ok) return;
      }
      state = incoming;
      save();
      toast('Import erfolgreich.');
    } catch {
      toast('Datei konnte nicht gelesen werden.');
    }
  });

  $('#clearBtn').addEventListener('click', async () => {
    if (!state.people.length) return;
    const ok = await confirmDlg('Wirklich alles löschen?', 'Alle Personen und Zeiten werden entfernt. Das lässt sich nicht rückgängig machen.');
    if (!ok) return;
    state = { people: [] };
    save();
    toast('Alles gelöscht.');
  });

  // ---------- Init ----------
  $('#since').value = toLocalInput(Date.now());
  load();
  render();
  handleShareHash();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
